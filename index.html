<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Frame — 静止動画メーカー</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141311">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="update-banner" id="updateBanner">
  <div class="update-banner-inner">
    <span id="updateBannerText">新しいバージョンが利用可能です</span>
    <span class="update-banner-notes" id="updateBannerNotes"></span>
  </div>
  <div class="update-banner-actions">
    <button id="updateBtn" type="button">更新する</button>
    <button id="updateDismissBtn" type="button" class="update-dismiss" aria-label="閉じる">×</button>
  </div>
</div>

<div class="masthead">
  <h1>Text Frame</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="offline-badge" id="offlineBadge">オフライン利用可</span>
    <div class="tag" id="dimsTag">720×240 / 1fps</div>
  </div>
</div>

<main>

  <section class="panel">
    <h2>01 — テキストと配色</h2>

    <label for="textInput">表示する文字</label>
    <textarea id="textInput" placeholder="ここに文字を入力してください">Hello, World.</textarea>

    <div class="row">
      <div class="field">
        <label for="textColor">文字色</label>
        <div class="color-input">
          <input type="color" id="textColor" value="#FFFFFF">
          <input type="text" id="textColorHex" value="#FFFFFF" maxlength="7">
        </div>
      </div>
      <div class="field">
        <label for="bgColor">背景色</label>
        <div class="color-input">
          <input type="color" id="bgColor" value="#000000">
          <input type="text" id="bgColorHex" value="#000000" maxlength="7">
        </div>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>文字の配置</label>
        <div class="toggle-group" id="alignGroup">
          <button type="button" data-align="left" class="active">左揃え</button>
          <button type="button" data-align="center">中央揃え</button>
        </div>
      </div>
    </div>

    <div class="slider-row">
      <label for="fontSize">文字サイズ <span class="value" id="fontSizeValue">64px</span></label>
      <input type="range" id="fontSize" min="10" max="180" value="64">
    </div>
  </section>

  <section class="panel">
    <h2>02 — ストップウォッチ / タイマー（オプション）</h2>

    <div class="radio-group">
      <label class="radio-pill"><input type="radio" name="clockMode" value="off" checked> なし</label>
      <label class="radio-pill"><input type="radio" name="clockMode" value="stopwatch"> ストップウォッチ</label>
      <label class="radio-pill"><input type="radio" name="clockMode" value="timer"> タイマー</label>
    </div>

    <div class="clock-detail" id="clockDetail">
      <label for="clockMinutes">時間（分単位で指定・表示は秒付き）</label>
      <div class="minutes-input">
        <input type="number" id="clockMinutes" min="0" step="0.5" value="1">
        <span>分</span>
      </div>
    </div>

    <div class="warning-note" id="clockWarning">
      時計オプションが有効な場合、実際に時間が進む動画を生成します。指定時間が長いほど生成に時間がかかります（動画の長さは指定分数+1秒）。
    </div>
  </section>

  <section class="panel">
    <h2>03 — プレビュー</h2>
    <div class="preview-wrap">
      <canvas id="previewCanvas" width="720" height="240"></canvas>
      <div class="dims" id="dimsNote">画像はそのまま動画のフレームになります</div>
    </div>

    <div class="actions">
      <button id="generateBtn">動画を生成する（MP4）</button>
    </div>
    <div class="status" id="statusText"></div>
    <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>

    <video id="resultVideo" controls playsinline webkit-playsinline style="display:none;"></video>

    <div class="actions" id="postActions" style="display:none;">
      <button id="downloadBtn" class="secondary">ダウンロード</button>
      <button id="shareBtn" class="secondary">共有</button>
      <button id="pipBtn" class="secondary" style="display:none;">ピクチャー・イン・ピクチャー</button>
    </div>
  </section>

</main>

<footer>
  Text Frame — canvas + WebCodecs + mp4-muxer（同梱・オフライン動作）で完結するクライアントサイド動画メーカー。サーバー送信なし。<br>
  v<span id="versionFooter"></span>
</footer>

<script src="vendor/mp4-muxer.js"></script>
<script>
  // このページの現在のバージョン。update.json の "version" と比較されます。
  // リリースごとにここと update.json の両方を更新してください。
  window.APP_VERSION = '1.2.0';
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('versionFooter');
    if(el) el.textContent = window.APP_VERSION;
  });
</script>
<script src="main.js"></script>
<script src="update.js"></script>

</body>
</html>
